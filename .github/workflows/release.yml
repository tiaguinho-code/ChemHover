name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify release version
        run: |
          node -e 'const pkg = require("./package.json"); const manifest = require("./manifest.json"); if (process.env.GITHUB_REF_NAME !== pkg.version || pkg.version !== manifest.version) throw new Error("Tag, package version, and manifest version must match.");'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "ChemHover $GITHUB_REF_NAME" --generate-notes main.js manifest.json styles.css
